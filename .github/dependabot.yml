version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns:
          - "*"
    # Caps move by hand, never by bot. pyproject.toml caps torch `<3`,
    # transformers `<6` and trl `<2`, and says each cap moves "deliberately
    # alongside the matching compat work, never on the resolver's own
    # initiative" (CIDOCS-B-103, FC-01). A Dependabot range widening IS the
    # resolver's own initiative, and CI cannot referee one. Measured 2026-09-23
    # on trl:
    #   - #169 (this block) widened `<0.28` to `<1.13` and went GREEN. Nothing
    #     in its CI installed a newly admitted trl: pip resolved trl 0.23.0,
    #     and the uv pilot ran the unchanged lock (0.24.0).
    #   - #210 (the uv block) widened to `<1.14` and re-locked trl 1.13.0,
    #     which no longer exports ORPOConfig / ORPOTrainer from `trl`. ORPO
    #     had no trl.experimental fallback in trainer.py then, so the ORPO path
    #     raised its own TrainingError; 11 ORPO/SimPO tests failed. To admit
    #     trl 1.13 the resolver also walked unsloth back a year (2026.6.8 ->
    #     2025.7.2) and protobuf back to 3.20.3.
    # So cap-crossing versions are ignored below; in-range updates still flow.
    # Move an entry in the same commit that moves its cap (trl: <0.28 -> <2).
    ignore:
      - dependency-name: "trl"
        versions: [">=2"]
      - dependency-name: "transformers"
        versions: [">=6"]
      - dependency-name: "torch"
        versions: [">=3"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # uv.lock is the source of truth for the fully-resolved transitive tree
  # (the `pip` block above only sees the direct deps in pyproject.toml). The
  # triaged-but-unfixed advisories the CI dep-audit accepts (diffusers
  # trust_remote_code GHSA-7wx4-6vff-v64p / GHSA-98h9-4798-4q5v, transformers
  # Trainer ACE GHSA-69w3-r845-3855) all live in the lockfile's transitive
  # closure; without this ecosystem they get no scheduled forcing function and
  # only close when a maintainer happens to re-run `uv lock`. Monthly, grouped,
  # limit 3 — same cadence/shape as the `pip` block. (CIDOCS-B-102)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      uv-deps:
        patterns:
          - "*"
    # Same cap guard, same reason, as the `pip` block above: the uv updater
    # rewrites the pyproject.toml ranges too (#210 carried the trl widening).
    ignore:
      - dependency-name: "trl"
        versions: [">=2"]
      - dependency-name: "transformers"
        versions: [">=6"]
      - dependency-name: "torch"
        versions: [">=3"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      astro-deps:
        patterns:
          - "@astrojs/*"
          - "astro"
      site-dev:
        dependency-type: "development"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(site)"
