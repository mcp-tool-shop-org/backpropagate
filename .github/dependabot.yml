version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      python-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # uv.lock is the source of truth for the fully-resolved transitive tree
  # (the `pip` block above only sees the direct deps in pyproject.toml), so an
  # advisory deep in that closure needs a scheduled forcing function or it
  # closes only when a maintainer happens to re-run `uv lock`. The three IDs
  # the CI dep-audit once accepted for that reason (diffusers
  # GHSA-7wx4-6vff-v64p / GHSA-98h9-4798-4q5v, transformers
  # GHSA-69w3-r845-3855) are fixed in uv.lock and came off its list on
  # 2026-09-23. Monthly, grouped, limit 3 — same cadence/shape as the `pip`
  # block. (CIDOCS-B-102)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      uv-deps:
        patterns:
          - "*"
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "ci"
    commit-message:
      prefix: "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "npm"
    directory: "/site"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      astro-deps:
        patterns:
          - "@astrojs/*"
          - "astro"
      site-dev:
        dependency-type: "development"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(site)"
