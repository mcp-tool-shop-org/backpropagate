name: Doc Drift Check

# Forcing-function CI for the within-swarm-doc-lie pattern: a PR that adds a
# new BACKPROPAGATE_* env var, a new --flag, or a new rx.State field WITHOUT
# updating the handbook + the cli.py env-var catalog will fail this check.
#
# Doctrine earned 2026-05-24, v1.3 swarm Wave 5 audit:
# [[within-swarm-doc-lie-drift-detection]]. Stripping or bypassing this
# workflow requires the same doctrine review.

on:
  # Paths mirror every input check_doc_drift.py actually reads, so the gate
  # fires exactly when a doc-drift surface could change and stays idle on
  # unrelated commits (repo GH-Actions rule: every CI workflow paths-gated).
  # README.md + llms.txt + tests/test_error_codes_catalog.py are load-bearing
  # here even though ci.yml omits them — the script's Class 4b (README error
  # codes) and Class 4 (error-codes catalog) checks read them directly, so a
  # README-only or catalog-only drift commit must still trip this gate.
  # NOT paths-gated, and it must stay that way: `drift-check` is a required
  # status check on main, and a paths filter that skips this workflow produces
  # no check run for protection to read, leaving the PR BLOCKED forever. PR #207
  # was green on all sixteen ci.yml contexts and unmergeable on this one alone,
  # because a gitpython bump touches pyproject.toml/uv.lock and neither is in
  # the list below. The script is one ubuntu job with a 5-minute cap; running it
  # on every PR is cheaper than the deadlock. See ci.yml's `on:` block for the
  # full reasoning and for the `if:`-inside-the-job alternative.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'backpropagate/**'
      - 'site/**'
      - 'README.md'
      - 'llms.txt'
      - 'scripts/**'
      - 'tests/test_error_codes_catalog.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Required by the studio Actions rules; this file had no block at all.
  # `head_ref || ref` and not the bare `ref`: this workflow fires on BOTH
  # push and pull_request, and `github.ref` differs between them for the same
  # commit (`refs/heads/<branch>` vs `refs/pull/N/merge`), so a bare-ref group
  # cannot collapse the pair and both runs go to completion on identical
  # bytes. `github.head_ref` is set only on pull_request and holds the source
  # branch, so both events share one group and the newer run cancels the older.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  drift-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
      - name: Run doc-drift check
        run: python scripts/check_doc_drift.py
