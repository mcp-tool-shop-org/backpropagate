name: Mutation testing (mutmut)

# TESTS-F-004 (v1.3 Wave 6b) — mutation-testing CI gate.
#
# Mutmut is in dev-deps but the v1.2 ship cycle never ran it in CI; the
# audit at swarms/v1.3-backpropagate/research/wave-5-feature-audit/tests.json
# flagged the missed regression-net opportunity.
#
# This workflow runs mutmut against a SCOPED subset of source files on
# ubuntu-latest, captures the surviving-mutation count, and posts it as a
# CI artifact. It is a SOFT GATE: the build does not fail unless the
# surviving count regresses by more than 5% from the recorded baseline
# (see .github/mutmut-baseline.txt). The intent is to catch test-suite
# weakening over time without breaking emergency hotfixes.
#
# Why ubuntu-latest only: mutmut 3.x imports stdlib `resource` which is
# POSIX-only — the package will not import on Windows. Local Windows
# contributors use scripts/run_mutmut.sh in WSL.
#
# Why scoped subset: a full-codebase mutmut run takes 30-60 minutes on a
# GitHub-hosted runner. The scoped subset (slao.py + checkpoints.py)
# covers the two most-modified Wave 6+ modules in <10 minutes. Expand
# the path list as additional modules harden.
#
# Trigger discipline: workflow_dispatch only for v1.3. Add `pull_request`
# / `schedule` in a follow-up once the baseline is stable for two
# release cycles (avoid noisy false-positive ratchets while contributors
# learn the surface).
#
# CIDOCS-F-022 (v1.4 Wave 6a) — baseline-bootstrap procedure.
# The first run after this workflow lands has no .github/mutmut-baseline.txt
# checked into main; the "Capture surviving-count" step records a new
# baseline locally on the runner. Operator action: trigger a run,
#
#     gh workflow run mutmut.yml -R mcp-tool-shop-org/backpropagate
#
# then read the run summary. When the baseline changed it shows the old and
# new counts and the commands that propose the new file as a PR; the file is
# also in the `mutmut-results` artifact. Reviewing that PR is the gate point
# that prevents silent ratcheting of the surviving-mutation count.
#
# The job is read-only (2026-10-01). It used to push a branch and open the
# PR itself, which needed contents/pull-requests/issues: write; OpenSSF
# Scorecard's Token-Permissions check scores any such write as 0, and a
# dispatch-only workflow run by hand gains little from opening its own PR.

on:
  workflow_dispatch:
    inputs:
      paths_to_mutate:
        description: 'Comma-separated paths to mutate (default: slao,checkpoints)'
        required: false
        default: 'backpropagate/slao.py,backpropagate/checkpoints.py'

# Read-only throughout (see the header): the baseline update is proposed by a
# person from the run summary, not pushed by the job.
permissions:
  contents: read

concurrency:
  # Required by the studio Actions rules; this file had no block at all.
  # Dispatch-only today, so this mainly stops a double-click from running two
  # mutation sweeps at once — the most expensive job shape in the repo.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutmut:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install backpropagate (dev extras)
        run: |
          # The package + dev extras (mutmut, pytest, hypothesis, etc), from
          # uv.lock with every package hash-checked. The smoke-test fast path
          # skips the heavy [ui]/[unsloth] extras to keep the install small.
          bash scripts/ci_install_locked.sh dev validation logging security

      - name: Show mutmut version
        run: mutmut --version

      - name: Run mutmut on scoped subset
        id: mutmut_run
        env:
          PATHS_TO_MUTATE: ${{ github.event.inputs.paths_to_mutate }}
        run: |
          # mutmut config block in pyproject.toml provides paths/runners; this
          # override allows the workflow_dispatch input to scope down further.
          set +e  # mutmut returns non-zero when mutants survive — don't fail the job
          mutmut run --paths-to-mutate "${PATHS_TO_MUTATE}"
          # capture exit code so we can decide on the gate below
          echo "mutmut_exit=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Capture surviving-count + soft gate
        run: |
          # mutmut results outputs to stdout; we parse the structured count.
          mutmut results 2>&1 | tee mutmut-results.txt
          # Extract surviving count (mutmut 2.x: "<N> survived"; mutmut 3.x: differs)
          SURVIVED=$(grep -oE '[0-9]+ survived' mutmut-results.txt | grep -oE '[0-9]+' || echo "0")
          echo "Surviving mutations: $SURVIVED"
          echo "SURVIVED=$SURVIVED" >> "$GITHUB_ENV"
          # Baseline lookup — if no baseline file, this is the first run; just
          # report and don't gate. Subsequent runs gate against +5% regression.
          BASELINE_FILE=".github/mutmut-baseline.txt"
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "No baseline file at $BASELINE_FILE — recording $SURVIVED as the new baseline."
            echo "$SURVIVED" > "$BASELINE_FILE"
            exit 0
          fi
          BASELINE=$(cat "$BASELINE_FILE")
          echo "Baseline: $BASELINE; current: $SURVIVED"
          # +5% regression threshold (rounded up)
          THRESHOLD=$(python -c "import math; print(math.ceil(${BASELINE} * 1.05))")
          if [ "$SURVIVED" -gt "$THRESHOLD" ]; then
            echo "::error::Surviving mutations ($SURVIVED) exceeds 5% regression threshold ($THRESHOLD, baseline $BASELINE)."
            exit 1
          fi
          echo "Within tolerance. Soft gate green."

      - name: Report a baseline change (proposed by a person, not pushed)
        # CIDOCS-B-002 — a run whose baseline differs from main says so in the
        # run summary, with the commands to propose it. Human review keeps the
        # gate honest (auto-merge would ratchet the bar to the latest run).
        if: success()
        env:
          BASELINE_FILE: .github/mutmut-baseline.txt
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$BASELINE_FILE" ]; then
            echo "No baseline file written by the soft-gate step; nothing to report."
            exit 0
          fi
          git fetch origin main --depth=1
          if git diff --quiet "origin/main" -- "$BASELINE_FILE" 2>/dev/null; then
            echo "Baseline unchanged vs origin/main."
            exit 0
          fi
          OLD=$(git show "origin/main:$BASELINE_FILE" 2>/dev/null || echo "none")
          NEW=$(cat "$BASELINE_FILE")
          {
            echo "## mutmut baseline changed: ${OLD} -> ${NEW} surviving mutants"
            echo
            echo "Review the delta, then propose it (the file is also in the \`mutmut-results\` artifact):"
            echo
            echo '```bash'
            echo "git switch -c ci/mutmut-baseline-$(date -u +%Y%m%d)"
            echo "echo ${NEW} > ${BASELINE_FILE}"
            echo "git add ${BASELINE_FILE}"
            echo "git commit -m 'ci(mutmut): update baseline (${OLD} -> ${NEW})'"
            echo "gh pr create --fill"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::mutmut baseline changed (${OLD} -> ${NEW}); see the run summary."

      - name: Upload mutmut artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutmut-results
          path: |
            mutmut-results.txt
            .github/mutmut-baseline.txt
          retention-days: 30
