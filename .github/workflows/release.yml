name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Serialize per-tag releases (don't cancel an in-flight release just because
# someone re-pushed the same tag or triggered workflow_dispatch). Cancelling a
# mid-flight `npm publish` after the Sigstore-provenance attestation has been
# signed but before the packument-save commits leaves the registry in a state
# where retries fail with E409 ('packument-save race') for 5-30 minutes — see
# memory: npm-publish-409-first-publish-race. Matching publish.yml's group
# shape keeps the publish + GHCR chain reaction (which fires on
# `release: published`) consistent with the upstream release run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write       # for GitHub Release creation
  id-token: write       # for npm provenance via Sigstore OIDC

jobs:
  release:
    name: Publish to npm + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      # Node 24 (LTS) rather than 22 because of npm, not because of Node. npm
      # >= 11.5 is required for OIDC trusted-publishing auth; Node 22 bundles
      # npm 10.9, which signs Sigstore provenance fine but cannot negotiate the
      # OIDC auth path -- the PUT returns a misleading 404 "not in this
      # registry" (see memory: npm-115-required-for-oidc). Node 24 bundles npm
      # 11.x (24.21.0 ships 11.19.0), so no separate npm install is needed.
      #
      # This replaces a sandbox `npm install npm@latest`, which could not be
      # pinned: a committed lockfile for the npm CLI drags npm's bundled
      # dependencies into the repo (brace-expansion, undici, ip-address), where
      # Trivy flags them and no published npm release has fixed versions yet.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Require npm >= 11.5 for OIDC trusted-publishing auth
        run: |
          NPM_VERSION="$(npm --version)"
          echo "node $(node --version), npm ${NPM_VERSION}"
          if ! node -e 'const [maj, min] = process.argv[1].split(".").map(Number); process.exit(maj > 11 || (maj === 11 && min >= 5) ? 0 : 1)' "${NPM_VERSION}"; then
            echo "::error::npm ${NPM_VERSION} cannot do OIDC trusted publishing (needs >= 11.5). Use a Node release that bundles a newer npm."
            exit 1
          fi

      # The CycloneDX npm SBOM tool, from a committed lockfile with `npm ci`
      # (.github/release-tools/) instead of `npx --yes`, which ran whatever
      # version was newest on release day. To move it:
      #   cd .github/release-tools && npm install @cyclonedx/cyclonedx-npm@<version> --save-exact
      # and commit package.json + package-lock.json together.
      - name: Install pinned release tools
        run: |
          SANDBOX="$HOME/.release-tools"
          mkdir -p "$SANDBOX"
          cp .github/release-tools/package.json .github/release-tools/package-lock.json "$SANDBOX/"
          pushd "$SANDBOX" >/dev/null
          npm ci --no-audit --no-fund --silent
          popd >/dev/null
          echo "$SANDBOX/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME} → ${TAG_VERSION}"
          echo "Package: ${PKG_VERSION}"
          if [ "${PKG_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match package.json version ${PKG_VERSION}"
            exit 1
          fi

      # ubuntu-latest's default python3 is not pinned to a particular minor
      # version. tomllib lives in Python 3.11+ stdlib — falling through to a
      # 3.10 default would ImportError. Pin 3.11 explicitly so the version
      # check is reproducible across runner-image bumps.
      # Pinned to the same setup-python SHA as ci.yml + publish.yml (v6.2.0)
      # so the action-runtime parity across workflows is consistent (the
      # v6.x line is the Node-24-runtime major; v6.0.0 → v6.2.0 is a patch
      # bump within that major).
      - name: Setup Python for pyproject version check
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Verify tag matches pyproject.toml version
        run: |
          PY_VERSION=$(python3 -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pyproject: ${PY_VERSION}"
          if [ "${PY_VERSION}" != "${TAG_VERSION}" ]; then
            echo "::error::Tag ${TAG_VERSION} does not match pyproject.toml version ${PY_VERSION}"
            exit 1
          fi

      # No dependency install step: package.json declares no dependencies (the
      # old comment about @mcptoolshop/npm-launcher was stale), so the
      # `npm install` that used to sit here installed nothing and, with no
      # lockfile, could not have been pinned. If a dependency is ever added,
      # commit package-lock.json and install it here with `npm ci`.
      - name: npm pack dry-run (verify shape)
        run: npm pack --dry-run

      - name: Publish to npm with provenance (OIDC trusted publisher)
        run: npm publish --provenance --access public

      # CIDOCS-F-004 — CycloneDX SBOM generation, attached to the GH Release.
      # Sigstore SBOM attestation already rides the `--provenance` flag on the
      # `npm publish` step above; this step adds the SBOM artifact itself to
      # the release so auditors can grep the dep tree without re-running
      # `pip install` or `npm install`. The Python SBOM describes the locked
      # core dependency closure (uv.lock, no extras): the hashed export of the
      # lock read by `cyclonedx-py requirements`, so it lists exactly the
      # versions and hashes CI tested, reproducibly, rather than whatever a
      # fresh `pip install .` resolved on release day. The npm SBOM is
      # generated from package.json. Both files are attached to the GH Release
      # after creation.
      - name: Set up Python for SBOM generation
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Generate CycloneDX SBOMs
        shell: bash
        run: |
          set -euo pipefail
          # cyclonedx-bom (entrypoint: cyclonedx-py) is the maintained
          # Python SBOM generator and the de-facto pick for CycloneDX in
          # PyPA tooling. Installed from a hash-pinned file.
          pip install --require-hashes -r requirements/sbom.txt
          # Core dependencies only (no extras), so the SBOM tracks the
          # published wheel's required-dep closure. Operators who install
          # with [full] get extra packages; those are surfaced via
          # pyproject.toml's optional-dependencies table.
          bash scripts/ci_install_locked.sh --export-only "${RUNNER_TEMP}/sbom-requirements.txt"

          # Wheel SBOM — the locked dependency closure, with the project as
          # the root component.
          cyclonedx-py requirements "${RUNNER_TEMP}/sbom-requirements.txt" \
            --pyproject pyproject.toml \
            --of JSON \
            -o backpropagate-sbom.cdx.json

          # Optional: capture the npm shim's tree too (the shim declares no
          # dependencies; still useful for the audit trail). cyclonedx-npm
          # comes from the committed lockfile in .github/release-tools/ (put on
          # PATH by the "Install pinned release tools" step), not from `npx --yes`.
          if command -v cyclonedx-npm >/dev/null 2>&1 && [ -f package.json ]; then
            # The tool wants evidence of an installed tree (a lockfile or a
            # node_modules/). The shim has no dependencies, so an empty
            # node_modules/ IS its installed state.
            mkdir -p node_modules
            cyclonedx-npm \
              --output-format JSON \
              --output-file backpropagate-npm-sbom.cdx.json || \
              echo "::warning::npm SBOM generation skipped (non-fatal)"
          fi

      - name: Create GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Extract the [<version>] section from CHANGELOG.md as the release notes.
          # Falls back to the tag name if the section is missing or empty.
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES_FILE="$(mktemp)"
          awk -v ver="${VERSION}" '
            $0 ~ "^## \\[" ver "\\]" {capture=1; next}
            capture && /^## \[/ {exit}
            capture {print}
          ' CHANGELOG.md > "${NOTES_FILE}"

          if [ ! -s "${NOTES_FILE}" ]; then
            echo "Backpropagate ${GITHUB_REF_NAME}" > "${NOTES_FILE}"
            echo "" >> "${NOTES_FILE}"
            echo "See CHANGELOG.md for details." >> "${NOTES_FILE}"
          fi

          # Create the release if it doesn't already exist. publish.yml fires
          # on the `release: published` event — it'll upload PyPI + Docker as
          # the chain reaction. (release-binaries.yml was retired in v1.3 —
          # PyInstaller distribution is no longer part of the chain.)
          # Skipping creation when the release exists
          # makes this step idempotent (re-runs via workflow_dispatch, or
          # second pushes of the same tag, no longer fail with HTTP 422
          # "Release.tag_name already exists").
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping create."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Backpropagate ${GITHUB_REF_NAME}" \
              --notes-file "${NOTES_FILE}" \
              --verify-tag
          fi

      # CIDOCS-F-004 — attach SBOM(s) to the GH Release. Done AFTER the
      # release exists per memory: release-yml-must-create-gh-release-
      # before-uploading-assets (gh release upload to a missing release
      # fails with "release not found"). `--clobber` keeps the upload
      # idempotent on workflow_dispatch re-runs.
      - name: Attach SBOMs to GH Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f backpropagate-sbom.cdx.json ]; then
            gh release upload "${GITHUB_REF_NAME}" backpropagate-sbom.cdx.json --clobber
          else
            echo "::warning::backpropagate-sbom.cdx.json missing — SBOM step may have failed"
          fi
          if [ -f backpropagate-npm-sbom.cdx.json ]; then
            gh release upload "${GITHUB_REF_NAME}" backpropagate-npm-sbom.cdx.json --clobber
          fi
