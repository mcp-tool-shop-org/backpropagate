# Canonical "UI in a container" compose file for backpropagate.
# CIDOCS-F-010 (Wave 6b, v1.3 prep); reworked for 1.8.1 so it starts.
#
# Usage:
#   printf 'alice:a-long-password' > ui-auth.txt   # once; see "Auth" below
#   docker compose up        # foreground; Ctrl+C stops
#   docker compose up -d     # background
#   docker compose down      # stop + remove
# Then open http://127.0.0.1:7860 and sign in with that user and password.
# The first start builds the UI's frontend inside the container (a minute or
# two); `docker compose logs -f` shows progress. Wait for "App running at".
#
# The image is published as a multi-arch manifest (linux/amd64 + linux/arm64);
# Docker Desktop on Apple Silicon and ARM-Linux operators pull the native
# arm64 layer automatically.
#
# Auth. Inside the container the UI must listen on 0.0.0.0, or the port
# mapping below cannot reach it, and `backprop ui` refuses a non-loopback
# listener without credentials (GHSA-f65r-h4g3-3h9h contract). So this file
# passes `--auth-file`, read from the `ui_auth` secret: a one-line
# `user:password` file next to this compose.yaml. `docker compose up` fails
# with a missing-file error until you create it. The password never appears
# in `docker inspect`, the process list or the logs: the UI keeps only a
# salted scrypt verifier. (An environment variable such as
# BACKPROPAGATE_UI_AUTH does NOT work: `backprop ui` ignores ambient
# credentials on purpose.)
#
# Exposure. The port mapping is loopback-only: only this machine can reach
# the UI. To reach it from other machines, prefer an SSH tunnel to this host
# (`ssh -L 7860:localhost:7860 <host>`). Changing the mapping to
# "0.0.0.0:7860:7860" publishes it to your network with only the password in
# front of it, over plain HTTP; see handbook/security.md first.
#
# Linux hosts. The container runs as `appuser`, not as your host user. A
# bind-mounted file or directory must be readable (ui-auth.txt) or writable
# (~/.backpropagate) by that user; Docker Desktop on macOS and Windows maps
# ownership for you. Telemetry: none. Reflex's own usage telemetry is
# switched off in the image.
#
# Volumes. ~/.backpropagate persists run history, checkpoints, and the UI
# sandbox base. On Windows hosts the path expands to
# %USERPROFILE%\.backpropagate via Docker Desktop's path translation.

services:
  ui:
    image: ghcr.io/mcp-tool-shop-org/backpropagate:latest
    # Override the image's default command (`--help`) with the UI.
    # `--port 7860` is the container-internal port; the host side of the
    # mapping below is what you open in the browser.
    command:
      - ui
      - --port
      - "7860"
      - --host
      - 0.0.0.0
      - --auth-file
      - /run/secrets/ui_auth
    ports:
      - "127.0.0.1:7860:7860"
    secrets:
      - ui_auth
    environment:
      # Optional structured-logging + monitoring knobs; uncomment to override.
      # - BACKPROPAGATE_LOG_LEVEL=INFO
      # - BACKPROPAGATE_LOG_JSON=true
      # - BACKPROPAGATE_UI_REQUEST_LOG=1
      - PYTHONUNBUFFERED=1
    volumes:
      # Persist run history, checkpoints, and the UI sandbox base. The
      # host-side `~/.backpropagate` matches what `backprop` writes when
      # run natively, so switching between container and native install
      # preserves state.
      - ${HOME:-${USERPROFILE}}/.backpropagate:/home/appuser/.backpropagate
    restart: unless-stopped
    healthcheck:
      # The image's own HEALTHCHECK runs `backpropagate --version`; this
      # repeats it at the compose layer so `docker compose ps` shows health.
      test: ["CMD", "backpropagate", "--version"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s

secrets:
  ui_auth:
    file: ./ui-auth.txt
