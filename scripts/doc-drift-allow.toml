    "BACKPROPAGATE_UI_AUTH",
    "BACKPROPAGATE_UI_AUTH_USER",
    "BACKPROPAGATE_UI_AUTH_VERIFIER",
    "BACKPROPAGATE_UI_CORS_EXTRA_ORIGINS",
    "BACKPROPAGATE_UI_HOST_BIND",
    "BACKPROPAGATE_UI_LAUNCH_TOKEN",
    "BACKPROPAGATE_UI_PORT",
    "BACKPROPAGATE_UI_SHARE_HOST",
    "BACKPROPAGATE_UI__OUTPUT_DIR",
]

# ---------------------------------------------------------------------------
# CLI flags registered via argparse.add_argument that intentionally are NOT
# in site/src/content/docs/handbook/cli-reference.md.
#
# The handbook covers the six top-level subcommands documented for new
# operators (train / multi-run / export / info / config / ui). The flags
# below belong to maintenance subcommands (push, runs, list-runs, resume,
# show-run) that have help text on the command itself but aren't yet
# table-formatted in the handbook. v1.4 cleanup target — until then,
# `backprop <subcmd> --help` is the canonical surface.
# ---------------------------------------------------------------------------
cli_flags_grandfathered = [
    "--env-vars",       # backprop info --env-vars
    "--error-codes",    # backprop info --error-codes
    "--hub-private",    # backprop push --hub-private
    "--hub-token",      # backprop push --hub-token
    "--include-base",   # backprop push --include-base
    "--json",           # backprop info --json / backprop runs --json
    "--limit",          # backprop list-runs --limit
    "--no-model-card",  # backprop push --no-model-card
    "--private",        # backprop push --private (deprecated alias for --hub-private)
    "--push-to-hub",    # backprop push --push-to-hub
    "--repo",           # backprop push --repo
    "--resume",         # backprop train --resume (documented in prose, not the table)
    # ui-v2 P1: hidden (argparse.SUPPRESS) internal contract between
    # `backprop ui` and the training subprocess — never an operator surface,
    # so it gets no handbook row. See backpropagate/job_events.py docstring.
    "--ui-run-dir",     # backprop train --ui-run-dir (internal, hidden)
    "--set",            # backprop config --set (already in cli-reference.md table for config)
    "--status",         # backprop runs --status
    "--token",          # backprop push --token
    "--verbose",        # top-level --verbose / -v
    "--version",        # top-level --version / -V
]

# ---------------------------------------------------------------------------
# Reflex state fields on rx.State subclasses with no consumer in ui_app/.
#
# The script's consumer heuristic walks ui_app/**/*.py for either
# `ClassName.fieldname` (direct attribute access) OR the class name +
# fieldname in the same file (covers template binding). False positives
# happen when a field is bound via a setter handler that doesn't show up
# as direct attribute access; list them per-class here.
#
# DELIBERATELY OMITTED — Wave 5.5 frontend agent is wiring the tooltip
# consumer for these in components/auth_badge.py. Listing them here would
# bypass the drift check; we want it to fire until the consumer lands.
#   AuthBadgeState.bind_host
#   AuthBadgeState.bind_port
#   AuthBadgeState.reachable_from
# ---------------------------------------------------------------------------
[reflex_state_fields_no_consumer_required]

# AppState surface state — `active_surface` mutates via set_active_surface
# event handler but the page selection reads it through Reflex's reactive
# var dispatcher pattern that the substring heuristic can't see.
AppState = [
    "active_surface",
]

# TrainState — gpu_safety telemetry fields populated by the trainer event
# stream but rendered through templated text the heuristic doesn't catch.
# ui-v2 P1 fix round adds the series fields: they feed the ``loss_label`` /
# ``loss_chart_data`` COMPUTED vars (server-side; the rendered JS references
# the computed var name), so the substring scan can't trace them.
TrainState = [
    "vram_used_gb",
    "vram_total_gb",
    # consumed by the loss_label computed var (4-decimal display; pages bind
    # train_state.loss_label, never the raw float)
    "current_loss",
    # consumed by the loss_chart_data computed var (recharts step/loss/ema rows)
    "ema_history",
    "step_history",
    # consumed by the job_run_label computed var ("run 2 of 3", ui-v2 P2)
    "job_runs",
    # ui-v2 P3 inline VRAM estimate: read by the vram_est_label / _pct /
    # _detail computed vars, which the page binds instead of the raw fields
    "vram_est_total",
    "vram_est_batch",
    "vram_est_note",
    # consumed by _finalize_job's stopped label (the GPU temperature stop)
    "job_safety_reason",
    # read by the vram_est_heading / vram_est_measured / vram_est_detail
    # computed vars ("measured on this GPU" vs "estimate")
    "vram_est_source",
    # what the estimate is compared with and the batch before it was lowered:
    # read by the vram_est_label / _pct / _detail computed vars
    "vram_est_tier_batch",
    "vram_est_budget",
    "vram_est_against",
    # the LoRA shape that follows the GPU (TrainState and MultiRunState): read
    # by the lora_caption / lora_gb_* / lora_can_follow_gpu / vram_fix_label
    # computed vars, which the LoRA card binds instead of the raw fields
    "lora_follow_gpu",
    "lora_recommended_fits",
    "lora_shape_gb",
    "lora_free_gb",
]

# MultiRunState — fields declared for the form but read only by handlers
# (ui-v2 P3 put every training field on the form; these remain).
MultiRunState = [
    # the LoRA shape that follows the GPU: read by the lora_caption /
    # lora_gb_* / lora_can_follow_gpu computed vars the LoRA card binds
    "lora_follow_gpu",
    "lora_recommended_fits",
    "lora_shape_gb",
    "lora_free_gb",
    "replay_fraction",
    "replay_fraction_error",
    "current_run_index",
    "events",
    "run_state",
]

# ExportState — events list populated by the export pipeline; rendered via
# Reflex foreach that the substring heuristic doesn't see. export_state: same
# Stage C honesty-floor situation as MultiRunState.run_state above — the page
# spinner consumer was removed when Export became "coming soon"; export_state
# returns with the deferred UI-export hookup (CLIUI-B-002, feature pass).
ExportState = [
    "events",
    "export_state",
]

# DatasetState — upload_count incremented by the upload event handler;
# read by templated text in the dataset page.
DatasetState = [
    "upload_count",
]

# RunsState — output_dir_override populated by config-read on mount; read
# by templated breadcrumb that the heuristic doesn't see.
RunsState = [
    "output_dir_override",
]

# ---------------------------------------------------------------------------
# Class 1 (argparse defaults vs handbook) — argparse ``default=None`` flags
# whose handbook cell carries the runtime-resolved value from config.py.
#
# Pattern: argparse defaults to None so cli.py can detect "operator did not
# pass this flag" and fall through to a config-sourced default. The handbook
# documents the user-observable runtime default rather than the argparse
# literal — which is the correct operator-facing contract. The drift gate
# can't distinguish "intentional argparse-None fallthrough" from "stale
# handbook string" without executing the runtime, so each instance earns
# an allow-list entry with the config-side source.
# ---------------------------------------------------------------------------
[argparse_default_drift_allowlist]
"--host" = "argparse default=None falls through to config.ui.host (default 127.0.0.1); handbook documents the runtime-resolved value"
"--log-level" = "argparse default=None; runtime reads BACKPROPAGATE_LOG_LEVEL (default INFO). Handbook documents the runtime-resolved value so operators see the effective default instead of 'unset'. v1.4 Wave 6b BRIDGE-F-002."
"--log-format" = "argparse default=None; runtime reads BACKPROPAGATE_LOG_JSON (default console). Handbook documents the runtime-resolved value. v1.4 Wave 6b BRIDGE-F-002."
"--hub-commit-message" = "argparse default=None; HF Hub push_to_hub() defaults to 'Upload model' when commit_message is None. Handbook documents the upstream default so operators don't have to chase the transformers reference. v1.4 Wave 6b BRIDGE-F-007."
"--lora-r" = "argparse default=None falls through to settings.lora.r (default 256, per BRIDGE-A-003 v1.4). Handbook documents the runtime-resolved value so the cli-reference matches what trainings actually use. v1.4 Wave 6b cross-domain."
"--name" = "backprop ollama register --name: argparse default=None; runtime derives the Ollama tag from the path basename (lora dir name or .gguf stem). Handbook documents the derivation rule so operators know what name will be registered when --name is omitted. v1.4 Wave 6b BRIDGE-F-014."

